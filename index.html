<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Cartas</title>
<meta name="description" content="Stock, compras, ventas y precios de tus cartas: Yu-Gi-Oh!, Pokémon, Magic, One Piece y Dragon Ball">
<meta name="theme-color" content="#5733c2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Cartas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo app de celular, barra de pestañas abajo, hojas que suben desde abajo */
:root{
  --bg:#eceef3; --surface:#ffffff; --ink:#1a1c29; --muted:#5f6478; --line:#d8dbe4;
  --accent:#5733c2; --accent-ink:#ffffff; --gold:#9a6a08; --gold-soft:#f6ecd4;
  --up:#1d7f47; --down:#c0352b; --up-soft:#e2f3e8; --down-soft:#fbe6e3;
  --display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(20,22,40,.06), 0 4px 14px rgba(20,22,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11121b; --surface:#1b1d2a; --ink:#ecedf4; --muted:#9ca1b6; --line:#2c2f42;
    --accent:#9f86ff; --accent-ink:#14111f; --gold:#e3b64c; --gold-soft:#2e2717;
    --up:#55c98a; --down:#ff7b6f; --up-soft:#16301f; --down-soft:#3a1c1a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11121b; --surface:#1b1d2a; --ink:#ecedf4; --muted:#9ca1b6; --line:#2c2f42;
  --accent:#9f86ff; --accent-ink:#14111f; --gold:#e3b64c; --gold-soft:#2e2717;
  --up:#55c98a; --down:#ff7b6f; --up-soft:#16301f; --down-soft:#3a1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:760px;margin:0 auto;min-height:100%;padding:0 16px 150px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.3px;margin:0;line-height:1}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:22px 0 10px;text-wrap:balance}
.estado{font-size:13px;color:var(--muted);text-align:right}
.aviso{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;margin:6px 0 10px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 14px}
.tile{background:var(--surface);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);min-width:0}
.tile small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.tile b{display:block;font-family:var(--display);font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.gold b{color:var(--gold)}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}

.buscador{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
.buscador input{width:100%;padding:13px 14px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--surface) no-repeat 14px center;font-size:17px}
.buscador .lupa{position:absolute;left:14px;top:50%;transform:translateY(-40%);color:var(--muted);pointer-events:none}
.buscador{position:sticky}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.lista{display:flex;flex-direction:column;gap:8px}
.fila{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid transparent;border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.fila:hover{border-color:var(--line)}
.f-nombre{font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.f-sub{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.f-precio{text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.f-precio .sin{color:var(--muted);font-size:13px}
.f-stock{min-width:52px;text-align:center;border-radius:10px;padding:4px 6px;background:var(--gold-soft)}
.f-stock b{display:block;font-family:var(--display);font-size:22px;line-height:1;color:var(--gold)}
.f-stock small{font-size:11px;color:var(--muted)}
.f-stock.cero{background:transparent;border:1px dashed var(--line)}
.f-stock.cero b{color:var(--muted)}
.var{display:inline-block;font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 6px;margin-top:3px}
.var.up{color:var(--up);background:var(--up-soft)}
.var.down{color:var(--down);background:var(--down-soft)}
.var.igual{color:var(--muted)}
.rar{display:inline-block;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);margin-right:6px;vertical-align:1px;background:var(--muted)}

.vacio{background:var(--surface);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.vacio b{display:block;color:var(--ink);font-family:var(--display);font-size:22px;margin-bottom:6px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:760px}
.tab{background:none;border:0;padding:8px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px, calc(50% - 364px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:14px 20px;box-shadow:0 6px 18px rgba(60,30,150,.35)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 14px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.venta{background:var(--up);border-color:var(--up);color:#fff}
.btn.peligro{color:var(--down);border-color:var(--down)}
.btn.chico{padding:7px 11px;font-size:14px}
.fila-btns{display:flex;gap:8px;flex-wrap:wrap}
.fila-btns .btn{flex:1 1 140px}

.capa{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.5);display:flex;align-items:flex-end;justify-content:center}
.capa[hidden]{display:none}
.hoja{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:700px){.capa{align-items:center}.hoja{border-radius:20px;max-height:88%}}
.hoja-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.hoja-top h2{margin:0}
.cerrar{border:0;background:var(--surface);border-radius:999px;width:36px;height:36px;font-size:20px;line-height:1;flex:none}
form{display:flex;flex-direction:column;gap:12px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label{font-size:14px;font-weight:600;color:var(--muted)}
.campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16.5px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:9px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input:checked + label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + label{outline:2px solid var(--accent)}
.ayuda{font-size:13.5px;color:var(--muted);margin:0}
.error{color:var(--down);font-weight:600;font-size:14.5px;margin:0}

.panel{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.dato{background:var(--surface);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.dato small{display:block;color:var(--muted);font-size:12.5px}
.dato b{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.grafico svg{display:block;width:100%;height:auto}
.historial{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.historial li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:15px}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:2px 8px}

.mov{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.tipo{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-radius:6px;padding:3px 7px}
.tipo.venta{background:var(--up-soft);color:var(--up)}
.tipo.compra{background:var(--gold-soft);color:var(--gold)}
.fecha-grupo{font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 4px;text-transform:uppercase;letter-spacing:.5px}

.barras{display:flex;flex-direction:column;gap:10px}
.barra-fila{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;font-size:14px}
.barra-par{display:flex;flex-direction:column;gap:3px}
.barra{height:12px;border-radius:4px;min-width:2px}
.barra.v{background:var(--up)} .barra.c{background:var(--gold)}
.leyenda{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

/* importar desde Excel */
.top-der{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.top-btns{display:flex;justify-content:flex-end;gap:6px}
.top-btns .btn{white-space:nowrap;padding:7px 10px}
.top{flex-wrap:wrap}
.top h1{white-space:nowrap}
.top-der{margin-left:auto}
.oculto{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.archivo{width:100%;margin:4px 0 10px}
.cols{display:flex;flex-direction:column;gap:8px}
.col-imp{display:grid;grid-template-columns:1fr minmax(160px,46%);gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.col-imp b{display:block;overflow-wrap:anywhere;font-size:15.5px}
.col-imp small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere;margin-top:2px}
.col-imp select,.sel-hoja{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15.5px}
.col-imp.usada select{border-color:var(--accent);font-weight:600}
@media (max-width:480px){.col-imp{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:10px 0 0;cursor:pointer}
.check[hidden]{display:none}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.imp-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 6px}
.imp-cab .f-sub{margin:0}
.resumen{font-size:16px;margin:0 0 6px}
.f-mas{font-family:var(--display);font-size:20px;font-weight:700;color:var(--gold);white-space:nowrap}
.f-mas.cero{color:var(--muted)}
.fila.previa{cursor:default}
.progreso{height:14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin:18px 0 8px}
.progreso i{display:block;height:100%;background:var(--accent);transition:width .2s}
.btn[disabled]{opacity:.5;cursor:default}
.importar-fin{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));background:var(--bg);padding:12px 0 6px;margin-top:12px;display:flex;flex-direction:column;gap:6px}
/* selector de juego */
.juegos{padding:0 0 8px}
.juegos .chip{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.juegos .chip small{font-size:12px;opacity:.75;font-weight:500}
/* autocompletado */
.auto{position:relative}
.sugs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.sugs:empty{display:none}
.sug{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.sug:hover,.sug:focus-visible{border-color:var(--accent)}
.sug img,.sug .sin-img{width:44px;height:62px;object-fit:cover;border-radius:4px;background:var(--line)}
.sug b{display:block;font-size:15.5px;overflow-wrap:anywhere}
.sug small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.sug-msg{color:var(--muted);font-size:14px;padding:4px 2px}
.elegida{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:8px 10px}
.elegida img{width:64px;height:90px;object-fit:cover;border-radius:5px}
.carta-img{display:block;width:120px;max-width:40%;border-radius:8px;box-shadow:var(--shadow);float:right;margin:0 0 10px 12px}
/* compartir */
.compartir textarea{width:100%;min-height:220px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;line-height:1.35;font-family:var(--body);resize:vertical}
.btn.wsp{background:#1fa855;border-color:#1fa855;color:#fff}
.acciones-stock{display:flex;gap:8px;margin:0 0 10px}
.acciones-stock .btn{flex:1}
@media (prefers-reduced-motion:no-preference){
  .hoja{animation:sube .18s ease-out}
  @keyframes sube{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="marca"><span class="logo" aria-hidden="true">◆</span><h1>Mis Cartas</h1></div>
    <div class="top-der">
      <div class="top-btns">
        <button class="btn chico" data-accion="copia" id="btn-copia">Copia</button>
        <button class="btn chico" data-accion="importar" id="btn-importar">Importar Excel</button>
      </div>
      <span id="estado" class="estado">Cargando…</span>
    </div>
  </header>
  <div id="juegos" class="chips juegos" role="group" aria-label="Juego"></div>
  <div id="aviso"></div>
  <main id="vista"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-tab="stock" id="tab-stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="17" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/></svg>Stock</button>
    <button class="tab" data-tab="movs" id="tab-movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4m0 16-4-4m4 4 4-4"/></svg>Movimientos</button>
    <button class="tab" data-tab="precios" id="tab-precios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Precios</button>
    <button class="tab" data-tab="ganancias" id="tab-ganancias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Ganancias</button>
  </div>
</nav>
<button class="fab" data-accion="nueva" id="fab">+ Carta</button>

<div id="capa" class="capa" hidden><div id="hoja" class="hoja" role="dialog" aria-modal="true" aria-label="Detalle"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
"use strict";

/* ---------------------------------------------------------------- utilidades */
const $ = s => document.querySelector(s);
const vista = $("#vista"), capa = $("#capa"), hoja = $("#hoja");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const ars = n => "$ " + Math.round(n).toLocaleString("es-AR");
const usd = n => "US$ " + n.toLocaleString("es-AR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const plata = (n, m) => m === "usd" ? usd(n) : ars(n);
const pct = n => (n > 0 ? "▲ " : n < 0 ? "▼ " : "") + Math.abs(n).toLocaleString("es-AR", {maximumFractionDigits: 1}) + "%";
const hoy = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const fFecha = iso => iso ? iso.split("-").reverse().join("/") : "";
const diasDesde = iso => Math.round((new Date(hoy()) - new Date(iso)) / 86400000);
const numero = v => { const n = parseFloat(String(v).replace(/\./g, "").replace(",", ".")); return isFinite(n) ? n : NaN; };
const numeroDec = v => { const s = String(v).trim(); const n = parseFloat(s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : s); return isFinite(n) ? n : NaN; };
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const RAREZAS = ["Common","Rare","Super Rare","Ultra Rare","Secret Rare","Ultimate Rare","Ghost Rare","Starlight Rare","Quarter Century Secret Rare","Collector's Rare","Prismatic Secret Rare","Platinum Secret Rare","Gold Rare","Short Print"];
const COLOR_RAREZA = {"Common":"#8a8fa3","Rare":"#7d8db8","Super Rare":"#3f86d6","Ultra Rare":"#d4a017","Secret Rare":"#c25bd6","Ultimate Rare":"#a0662c","Ghost Rare":"#9fb6c6","Starlight Rare":"#e85d9b","Quarter Century Secret Rare":"#e0453a","Collector's Rare":"#4fb3a9","Prismatic Secret Rare":"#7a5cf0","Platinum Secret Rare":"#b8bcc8","Gold Rare":"#c99a1c"};
const IDIOMAS = ["Inglés","Español","Portugués","Francés","Alemán","Italiano","Japonés","Otro"];
const ESTADOS = ["Near Mint","Lightly Played","Moderately Played","Heavily Played","Damaged"];

/* ------------------------------------------------------------------ juegos */
const JUEGOS = {
  ygo:   {nombre: "Yu-Gi-Oh!", tcg: "yugioh", ml: "yugioh", rarezas: RAREZAS,
          ejNombre: "Ej: Ash Blossom & Joyous Spring", ejSet: "Ej: MACR-EN036", ayudaSet: "El código está abajo a la derecha de la imagen de la carta."},
  pkm:   {nombre: "Pokémon", tcg: "pokemon", ml: "pokemon tcg",

};
Object.assign(COLOR_RAREZA, {"Uncommon":"#5aa06b","Rare Holo":"#3f86d6","Double Rare":"#d4a017","Illustration Rare":"#e85d9b","Special Illustration Rare":"#c25bd6",
  "Hyper Rare":"#c99a1c","ACE SPEC Rare":"#e0453a","Shiny Rare":"#9fb6c6","Promo":"#4fb3a9","Mythic Rare":"#e0453a","Special":"#7a5cf0","Bonus":"#4fb3a9",
  "Leader":"#e0453a","Treasure Rare":"#c99a1c","Special Rare":"#e85d9b","Alternate Art":"#7a5cf0"});
const juegoDe = c => (c && JUEGOS[c.juego]) ? c.juego : "ygo";
const esSellado = c => !!c && c.clase === "sellado";
const PRODUCTOS = ["Caja (Booster Box)","Sobre","Display","Structure / Starter Deck","Lata (Tin)","Caja de colección","Bundle / ETB","Otro"];
const J = () => JUEGOS[ui.juego];
const cartasJuego = () => [...cartas.values()].filter(c => juegoDe(c) === ui.juego);

const linkTCG = c => { const j = JUEGOS[juegoDe(c)]; return `https://www.tcgplayer.com/search/${j.tcg}/product?productLineName=${j.tcg}&q=` + encodeURIComponent(c.nombre); };
const linkML = c => "https://listado.mercadolibre.com.ar/" + encodeURIComponent(norm(JUEGOS[juegoDe(c)].ml + " " + c.nombre + (c.set ? " " + c.set : "")).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""));

/* --------------------------------------------------------------------- estado */
let cartas = new Map();   // id -> {id, nombre, set, rareza, idioma, estado, notas, creada, precios:[{f, v, m}]}
let movs = [];            // {id, cartaId, tipo, cant, precio, fecha, nota, ts}
let cargadoC = false, cargadoM = false, confirmado = false;
let db = null, colCartas = null, colMovs = null, modoPrueba = false;
const CLAVE_JUEGO = "mis-cartas-juego";
const juegoGuardado = (() => { try { return localStorage.getItem(CLAVE_JUEGO); } catch (e) { return null; } })();
const ui = {tab: "stock", q: "", rareza: null, soloStock: true, modal: null, tipoMov: "todos", monedaGraf: "usd", clase: "cartas", juego: JUEGOS[juegoGuardado] ? juegoGuardado : "ygo"};

/* ---------------------------------------------------------------- guardado */
let contadorLocal = 0;
const nuevoId = () => colCartas ? colCartas.doc().id : "l" + Date.now() + (contadorLocal++);
const sinId = o => { const c = {...o}; delete c.id; return c; };

async function conReintento(fn){
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random()*800)); return await fn(); }
    throw e;
  }
}
function errorGuardado(e){
  const msg = e && e.code === "quota_exceeded" ? "Se llenó el espacio de la app. Borrá movimientos viejos para seguir."
    : "No se pudo guardar. Probá de nuevo.";
  aviso(msg); throw e;
}
/* Los datos viven en este dispositivo (localStorage). modoPrueba = guardado local. */
const CLAVE = "mis-cartas-v1";
const datosCopia = () => ({app: "mis-cartas", v: 1, fecha: hoy(), cartas: [...cartas.values()], movs});
function leerLocal(){
  const t = localStorage.getItem(CLAVE);
  const d = t ? JSON.parse(t) : {};
  cartas = new Map((d.cartas || []).map(c => [c.id, c]));
  movs = d.movs || [];
}
function persistir(){
  try { localStorage.setItem(CLAVE, JSON.stringify(datosCopia())); }
  catch (e) { const err = new Error("no-guardo"); err.code = "quota_exceeded"; throw err; }
}
function local(cambio){
  cambio();
  try { persistir(); }
  catch (e) { try { leerLocal(); } catch (_) {} render(); errorGuardado(e); }
  render();
}
async function guardarCarta(c){
  if (modoPrueba) { local(() => cartas.set(c.id, c)); return; }
  try { await conReintento(() => colCartas.doc(c.id).set(sinId(c))); } catch (e) { errorGuardado(e); }
}
async function borrarCartaDB(id){
  const suyos = movs.filter(m => m.cartaId === id);
  if (modoPrueba) { local(() => { cartas.delete(id); movs = movs.filter(m => m.cartaId !== id); }); return; }
  try {
    for (const m of suyos) await conReintento(() => colMovs.doc(m.id).delete());
    await conReintento(() => colCartas.doc(id).delete());
  } catch (e) { errorGuardado(e); }
}
async function guardarMov(m){
  if (modoPrueba) { local(() => movs.push(m)); return; }
  try { await conReintento(() => colMovs.doc(m.id).set(sinId(m))); } catch (e) { errorGuardado(e); }
}
async function borrarMovDB(id){
  if (modoPrueba) { local(() => { movs = movs.filter(m => m.id !== id); }); return; }
  try { await conReintento(() => colMovs.doc(id).delete()); } catch (e) { errorGuardado(e); }
}

/* ---------------------------------------------------------------- cálculos */
function indiceMovs(){
  const idx = new Map();
  for (const m of movs) { if (!idx.has(m.cartaId)) idx.set(m.cartaId, []); idx.get(m.cartaId).push(m); }
  return idx;
}
function preciosDe(c, moneda){
  return (c.precios || []).filter(p => p.m === moneda).slice().sort((a, b) => a.f < b.f ? -1 : a.f > b.f ? 1 : 0);
}
function infoCarta(c, idx){
  const ms = (idx || indiceMovs()).get(c.id) || [];
  let compU = 0, comp = 0, vendU = 0, vend = 0;
  for (const m of ms) {
    if (m.tipo === "compra") { compU += m.cant; comp += m.cant * m.precio; }
    else { vendU += m.cant; vend += m.cant * m.precio; }
  }
  const out = {stock: compU - vendU, compU, comp, vendU, vend, costo: compU ? comp / compU : null};
  for (const mon of ["usd", "ars"]) {
    const ps = preciosDe(c, mon);
    const ult = ps[ps.length - 1], ant = ps[ps.length - 2];
    out[mon] = ult ? ult.v : null;
    out[mon + "Fecha"] = ult ? ult.f : null;
    out[mon + "Var"] = ult && ant && ant.v ? (ult.v - ant.v) / ant.v * 100 : null;
  }
  out.ultPrecio = [out.usdFecha, out.arsFecha].filter(Boolean).sort().pop() || null;
  return out;
}
function etiquetaCarta(c){
  if (esSellado(c)) return [c.producto || "Producto cerrado", c.set, c.idioma !== "Inglés" ? c.idioma : null].filter(Boolean).join(" · ");
  return [c.set, c.rareza, c.idioma !== "Inglés" ? c.idioma : null].filter(Boolean).join(" · ") || "Sin edición";
}
function chipVar(v){
  if (v == null) return "";
  const cl = v > 0.05 ? "up" : v < -0.05 ? "down" : "igual";
  return `<span class="var ${cl}">${pct(v)}</span>`;
}

/* ----------------------------------------------------------------- avisos */
let tToast;
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tToast); tToast = setTimeout(() => el.hidden = true, 2600); }
function aviso(t){ $("#aviso").innerHTML = t ? `<div class="aviso">${esc(t)}</div>` : ""; }
function estado(t){ $("#estado").textContent = t; }

/* -------------------------------------------------------------------- vistas */
function render(){
  if (importando) return;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === ui.tab ? "page" : "false"));
  pintarJuegos();
  $("#fab").textContent = ui.clase === "sellado" ? "+ Caja" : "+ Carta";
  if (!cargadoC || !cargadoM) { vista.innerHTML = `<div class="vacio"><b>Cargando tus cartas…</b>Un segundo.</div>`; return; }
  ({stock: vistaStock, movs: vistaMovs, precios: vistaPrecios, ganancias: vistaGanancias})[ui.tab]();
  if (ui.modal && ui.modal.tipo === "detalle") abrirDetalle(ui.modal.id, true);
}

function vistaStock(){
  const idx = indiceMovs();
  let unidades = 0, distintas = 0, invertido = 0, valorUsd = 0, valorArs = 0;
  const sell = ui.clase === "sellado";
  const delJuego = cartasJuego().filter(c => esSellado(c) === sell);
  for (const c of delJuego) {
    const i = infoCarta(c, idx);
    if (i.stock > 0) {
      distintas++; unidades += i.stock;
      invertido += (i.costo || 0) * i.stock;
      if (i.usd) valorUsd += i.usd * i.stock;
      if (i.ars) valorArs += i.ars * i.stock;
    }
  }
  const ordenR = J().rarezas, posR = r => ordenR.includes(r) ? ordenR.indexOf(r) : 99;
  const rarezas = [...new Set(delJuego.map(c => c.rareza).filter(Boolean))].sort((a, b) => posR(a) - posR(b));
  if (ui.rareza && !rarezas.includes(ui.rareza)) ui.rareza = null;
  vista.innerHTML = `
    <section class="tiles" aria-label="Resumen">
      <div class="tile"><small>${sell ? "Productos en stock" : "Cartas en stock"}</small><b>${distintas}</b></div>
      <div class="tile"><small>Unidades</small><b>${unidades}</b></div>
      <div class="tile"><small>Invertido en stock</small><b>${ars(invertido)}</b></div>
      <div class="tile gold"><small>Valor de lo que tiene precio anotado</small><b>${valorArs ? ars(valorArs) : valorUsd ? usd(valorUsd) : "—"}</b></div>
    </section>
    <div class="seg" role="radiogroup" aria-label="Qué ver" style="margin:0 0 10px">
      <input type="radio" name="clase" id="clase-cartas" value="cartas" ${sell ? "" : "checked"}><label for="clase-cartas">Cartas</label>
      <input type="radio" name="clase" id="clase-sellado" value="sellado" ${sell ? "checked" : ""}><label for="clase-sellado">Cajas y sobres</label>
    </div>
    <div class="acciones-stock"><button class="btn wsp" data-accion="compartir">Compartir lista por WhatsApp</button></div>
    <div class="buscador">
      <label for="q" class="lupa" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></label>
      <input id="q" type="search" placeholder="${sell ? "Buscar caja, sobre o expansión" : "Buscar por nombre, set o nota"}" value="${esc(ui.q)}" autocomplete="off" aria-label="Buscar carta">
    </div>
    <div class="chips" role="group" aria-label="Filtros">
      <button class="chip" data-accion="soloStock" aria-pressed="${ui.soloStock}">Solo con stock</button>
      ${rarezas.map(r => `<button class="chip" data-accion="rareza" data-r="${esc(r)}" aria-pressed="${ui.rareza === r}"><span class="rar" style="background:${COLOR_RAREZA[r] || "var(--muted)"}"></span>${esc(r)}</button>`).join("")}
    </div>
    <div id="lista" class="lista"></div>`;
  pintarLista();
}

/* las cartas que se ven en Stock con el juego, la búsqueda y los filtros de ahora */
function filtradas(idx){
  const q = norm(ui.q).trim();
  return cartasJuego().filter(c => esSellado(c) === (ui.clase === "sellado")).map(c => ({c, i: infoCarta(c, idx)}))
    .filter(({c, i}) => (!ui.soloStock || i.stock > 0) && (!ui.rareza || c.rareza === ui.rareza)
      && (!q || norm(c.nombre + " " + (c.set || "") + " " + (c.notas || "") + " " + (c.rareza || "") + " " + (c.producto || "")).includes(q)))
    .sort((a, b) => a.c.nombre.localeCompare(b.c.nombre, "es"));
}
const movsJuego = () => movs.filter(m => { const c = cartas.get(m.cartaId); return c && juegoDe(c) === ui.juego; });

function pintarJuegos(){
  const n = {};
  for (const c of cartas.values()) { const j = juegoDe(c); n[j] = (n[j] || 0) + 1; }
  $("#juegos").innerHTML = Object.entries(JUEGOS).map(([k, j]) =>
    `<button class="chip" data-accion="juego" data-j="${k}" aria-pressed="${ui.juego === k}">${esc(j.nombre)}${n[k] ? ` <small class="num">${n[k]}</small>` : ""}</button>`).join("");
}
function cambiarJuego(k){
  if (!JUEGOS[k] || k === ui.juego) return;
  ui.juego = k; ui.rareza = null; ui.q = "";
  try { localStorage.setItem(CLAVE_JUEGO, k); } catch (e) {}
  window.scrollTo(0, 0);
  render();
}

function pintarLista(){
  const lista = $("#lista"); if (!lista) return;
  if (ui.clase === "sellado" && !cartasJuego().some(esSellado)) {
    lista.innerHTML = `<div class="vacio"><b>Todavía no cargaste cajas ni sobres de ${esc(J().nombre)}</b>Tocá <strong>+ Caja</strong> abajo a la derecha para cargar una caja, sobre, lata o mazo cerrado.</div>`;
    return;
  }
  if (ui.clase !== "sellado" && !cartasJuego().some(c => !esSellado(c))) {
    lista.innerHTML = `<div class="vacio"><b>Todavía no cargaste cartas de ${esc(J().nombre)}</b>Tocá <strong>+ Carta</strong> abajo a la derecha para cargar la primera, o traelas todas juntas desde una planilla.<div style="margin-top:14px"><button class="btn pri" data-accion="importar">Importar desde Excel</button></div></div>`;
    return;
  }
  const filas = filtradas(indiceMovs());
  if (!filas.length) {
    lista.innerHTML = `<div class="vacio"><b>No hay ${ui.clase === "sellado" ? "productos" : "cartas"} con ese filtro</b>${ui.soloStock ? "Probá sacando “Solo con stock”." : "Probá con otra palabra."}</div>`;
    return;
  }
  lista.innerHTML = filas.map(({c, i}) => {
    const precio = i.ars != null ? `${ars(i.ars)}<br>${chipVar(i.arsVar)}` : i.usd != null ? `${usd(i.usd)}<br>${chipVar(i.usdVar)}` : `<span class="sin">sin precio</span>`;
    return `<button class="fila" data-accion="detalle" data-id="${esc(c.id)}">
      <div><div class="f-nombre">${esSellado(c) ? `<span class="rar" style="background:var(--accent);transform:none;border-radius:2px"></span>` : ""}${c.rareza ? `<span class="rar" style="background:${COLOR_RAREZA[c.rareza] || "var(--muted)"}"></span>` : ""}${esc(c.nombre)}</div>
      <div class="f-sub">${esc(etiquetaCarta(c))}${c.notas ? " · " + esc(c.notas) : ""}</div></div>
      <div class="f-precio">${precio}</div>
      <div class="f-stock ${i.stock > 0 ? "" : "cero"}"><b class="num">${i.stock}</b><small>stock</small></div>
    </button>`;
  }).join("");
}

function vistaMovs(){
  const lista = movsJuego().filter(m => ui.tipoMov === "todos" || m.tipo === ui.tipoMov)
    .sort((a, b) => (b.fecha + (b.ts || 0)).localeCompare(a.fecha + (a.ts || 0)) || (b.ts || 0) - (a.ts || 0));
  let html = `<h2>Movimientos</h2>
    <div class="chips" role="group" aria-label="Tipo">
      ${[["todos","Todos"],["venta","Ventas"],["compra","Compras"]].map(([k, t]) => `<button class="chip" data-accion="tipoMov" data-t="${k}" aria-pressed="${ui.tipoMov === k}">${t}</button>`).join("")}
    </div>`;
  if (!lista.length) {
    html += `<div class="vacio"><b>Sin movimientos</b>Abrí una carta desde Stock y tocá Vender o Comprar.</div>`;
  } else {
    let fechaActual = "";
    html += `<div class="lista">`;
    for (const m of lista.slice(0, 300)) {
      if (m.fecha !== fechaActual) { fechaActual = m.fecha; html += `<div class="fecha-grupo">${fechaLarga(m.fecha)}</div>`; }
      const c = cartas.get(m.cartaId);
      html += `<div class="mov">
        <span class="tipo ${m.tipo}">${m.tipo}</span>
        <div><div class="f-nombre">${esc(c ? c.nombre : "Carta borrada")}</div>
          <div class="f-sub num">${m.cant} × ${ars(m.precio)}${m.nota ? " · " + esc(m.nota) : ""}</div></div>
        <div style="display:flex;align-items:center;gap:4px"><b class="num">${ars(m.cant * m.precio)}</b>
          <button class="x" data-accion="borrarMov" data-id="${esc(m.id)}" aria-label="Borrar movimiento">×</button></div>
      </div>`;
    }
    html += `</div>`;
  }
  vista.innerHTML = html;
}
function fechaLarga(iso){
  const d = diasDesde(iso);
  if (d === 0) return "Hoy";
  if (d === 1) return "Ayer";
  const [y, m, dd] = iso.split("-");
  return `${+dd} ${MESES[+m - 1]} ${y}`;
}

function vistaPrecios(){
  const idx = indiceMovs();
  const todas = cartasJuego().map(c => ({c, i: infoCarta(c, idx)}));
  const conStock = todas.filter(x => x.i.stock > 0)
    .sort((a, b) => (a.i.ultPrecio || "0000").localeCompare(b.i.ultPrecio || "0000"));
  const cambios = todas.map(x => ({...x, v: x.i.arsVar ?? x.i.usdVar, mon: x.i.arsVar != null ? "ars" : "usd"})).filter(x => x.v != null && Math.abs(x.v) > 0.05);
  const suben = cambios.filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 8);
  const bajan = cambios.filter(x => x.v < 0).sort((a, b) => a.v - b.v).slice(0, 8);
  const filaCambio = x => `<button class="fila" data-accion="detalle" data-id="${esc(x.c.id)}">
      <div><div class="f-nombre">${esc(x.c.nombre)}</div><div class="f-sub">${esc(etiquetaCarta(x.c))}</div></div>
      <div class="f-precio">${plata(x.i[x.mon], x.mon)}<br>${chipVar(x.v)}</div><span></span></button>`;

  let html = `<h2>Subas y bajas</h2>
    <p class="ayuda">Compara el último precio que anotaste con el anterior de cada carta.</p>`;
  if (!cambios.length) {
    html += `<div class="vacio"><b>Todavía no hay comparaciones</b>Anotá el precio de una carta dos veces, en días distintos, y acá vas a ver si subió o bajó.</div>`;
  } else {
    html += `<div class="lista">${suben.map(filaCambio).join("")}${bajan.map(filaCambio).join("")}</div>`;
  }
  html += `<h2>Para revisar el precio</h2>
    <p class="ayuda">Tus cartas en stock, empezando por las que hace más que no les mirás el precio.</p>`;
  if (!conStock.length) {
    html += `<div class="vacio"><b>No hay cartas en stock</b>Cargá una con <strong>+ Carta</strong>.</div>`;
  } else {
    html += `<div class="lista">` + conStock.slice(0, 60).map(({c, i}) => {
      const hace = i.ultPrecio ? (diasDesde(i.ultPrecio) === 0 ? "hoy" : `hace ${diasDesde(i.ultPrecio)} días`) : "nunca";
      return `<div class="panel" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
          <div><div class="f-nombre">${esc(c.nombre)}</div><div class="f-sub">${esc(etiquetaCarta(c))} · precio anotado ${hace}</div></div>
          <div class="f-precio">${i.ars != null ? ars(i.ars) : ""}${i.ars != null && i.usd != null ? "<br>" : ""}${i.usd != null ? usd(i.usd) : ""}</div>
        </div>
        <div class="fila-btns">
          <a class="btn chico" href="${linkTCG(c)}" target="_blank" rel="noopener">TCGplayer ↗</a>
          <a class="btn chico" href="${linkML(c)}" target="_blank" rel="noopener">MercadoLibre ↗</a>
          <button class="btn chico pri" data-accion="precio" data-id="${esc(c.id)}">Anotar precio</button>
        </div></div>`;
    }).join("") + `</div>`;
  }
  vista.innerHTML = html;
}

function vistaGanancias(){
  const idx = indiceMovs();
  let vendido = 0, costoVendido = 0, sinCosto = 0;
  const porCarta = [];
  for (const c of cartasJuego()) {
    const i = infoCarta(c, idx);
    if (!i.vendU) continue;
    const costo = (i.costo || 0) * i.vendU;
    if (i.costo == null) sinCosto++;
    vendido += i.vend; costoVendido += costo;
    porCarta.push({c, i, ganancia: i.vend - costo});
  }
  const meses = new Map();
  for (const m of movsJuego()) {
    const k = m.fecha.slice(0, 7);
    if (!meses.has(k)) meses.set(k, {venta: 0, compra: 0});
    meses.get(k)[m.tipo] += m.cant * m.precio;
  }
  const ultMeses = [...meses.entries()].sort((a, b) => a[0] < b[0] ? 1 : -1).slice(0, 6);
  const max = Math.max(1, ...ultMeses.flatMap(([, v]) => [v.venta, v.compra]));
  const ganancia = vendido - costoVendido;

  let html = `<h2>Ganancias</h2>
    <section class="tiles">
      <div class="tile"><small>Total vendido</small><b>${ars(vendido)}</b></div>
      <div class="tile"><small>Lo que te costaron</small><b>${ars(costoVendido)}</b></div>
      <div class="tile gold" style="grid-column:span 2"><small>Ganancia</small><b style="color:${ganancia >= 0 ? "var(--up)" : "var(--down)"}">${ars(ganancia)}</b></div>
    </section>

/* ------------------------------------------------- buscador con autocompletado */
let auto = null;        // {juego, sel, token, lista, item}
let tAuto = null;
const cacheAuto = new Map();
const usdTxt = v => "US$ " + Number(v).toLocaleString("es-AR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const precioOk = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; };

async function pedirJSON(url){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch(url, {signal: ctl.signal, headers: {Accept: "application/json"}});
    if (r.status === 400 || r.status === 404) return null;     // "no encontré nada"
    if (!r.ok) throw new Error("red");
    return await r.json();
  } finally { clearTimeout(t); }
}
/* cada buscador devuelve [{nombre, img, info, ediciones:[{set, setNombre, rareza, img, usd}] | null}] */
async function buscarYGO(q){
  const d = await pedirJSON("https://db.ygoprodeck.com/api/v7/cardinfo.php?num=8&offset=0&fname=" + encodeURIComponent(q));
  return ((d && d.data) || []).map(c => {
    const img = c.card_images && c.card_images[0] ? c.card_images[0].image_url_small : "";
    const eds = (c.card_sets || []).map(s => ({set: String(s.set_code || "").toUpperCase(), setNombre: s.set_name || "", rareza: s.set_rarity || "", img, usd: precioOk(s.set_price)}));
    return {nombre: c.name, img, info: [c.type, eds.length ? eds.length + " edición(es)" : ""].filter(Boolean).join(" · "), ediciones: eds};
  });
}
/* Pokémon: TCGdex. La búsqueda trae nombre + imagen; rareza, expansión y precio se piden al elegir la edición */
const tituloPal = s => String(s || "").replace(/\b\w/g, l => l.toUpperCase());
async function buscarPKM(q){
  const d = await pedirJSON("https://api.tcgdex.net/v2/en/cards?name=" + encodeURIComponent(q.trim()));
  const lista = (Array.isArray(d) ? d : []).filter(c => c.image && !/\/tcgp\//.test(c.image)).reverse();   // sin las de TCG Pocket, más nuevas primero
  const grupos = new Map();
  for (const c of lista) {
    const img = c.image + "/low.webp";
    if (!grupos.has(c.name)) grupos.set(c.name, {nombre: c.name, img, ediciones: []});
    grupos.get(c.name).ediciones.push({id: c.id, set: String(c.id || "").toUpperCase().replace(/-(?=[^-]*$)/, " "), setNombre: "", rareza: "", img, usd: null});
  }
  const qn = norm(q).trim(), punt = n => norm(n) === qn ? 0 : norm(n).startsWith(qn) ? 1 : 2;
  return [...grupos.values()].sort((a, b) => punt(a.nombre) - punt(b.nombre) || a.nombre.length - b.nombre.length)
    .slice(0, 8).map(g => ({...g, info: g.ediciones.length + " edición(es)"}));
}
async function detallePKM(e){
  const c = await pedirJSON("https://api.tcgdex.net/v2/en/cards/" + encodeURIComponent(e.id));
  if (!c) return e;
  const tp = c.pricing && c.pricing.tcgplayer ? Object.values(c.pricing.tcgplayer).filter(v => v && typeof v === "object") : [];
  const usd = tp.map(v => precioOk(v.marketPrice) || precioOk(v.midPrice)).find(Boolean) || null;
  return {...e, setNombre: c.set ? c.set.name : "", rareza: c.rarity && c.rarity !== "None" ? tituloPal(c.rarity) : "", usd};
}
const RAREZA_MTG = {common: "Common", uncommon: "Uncommon", rare: "Rare", mythic: "Mythic Rare", special: "Special", bonus: "Bonus"};
async function buscarMTG(q){
  const d = await pedirJSON("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(q));
  return ((d && d.data) || []).slice(0, 8).map(n => ({nombre: n, img: "", info: "Tocá para ver las ediciones", ediciones: null}));
}
async function edicionesMTG(nombre){
  const d = await pedirJSON("https://api.scryfall.com/cards/search?unique=prints&order=released&q=" + encodeURIComponent(`!"${nombre}"`));
  return ((d && d.data) || []).slice(0, 40).map(c => {
    const iu = c.image_uris || (c.card_faces && c.card_faces[0] && c.card_faces[0].image_uris) || {};
    return {set: String(c.set || "").toUpperCase() + " " + c.collector_number, setNombre: c.set_name || "", rareza: RAREZA_MTG[c.rarity] || c.rarity || "",
      img: iu.small || "", usd: precioOk(c.prices && (c.prices.usd || c.prices.usd_foil))};
  });
}
const BUSCADORES = {ygo: buscarYGO, pkm: buscarPKM, mtg: buscarMTG};

function sugsHTML(html){ const el = $("#sugs"); if (el) el.innerHTML = html; }
const imgSug = src => src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="sin-img"></span>`;

function programarBusqueda(texto){
  clearTimeout(tAuto);
  if (!auto || !BUSCADORES[auto.juego]) return;
  const q = texto.trim();
  if (q.length < 3) { auto.token++; sugsHTML(""); return; }
  tAuto = setTimeout(() => buscarAhora(q), 350);
}
async function buscarAhora(q){
  const tok = ++auto.token, k = auto.juego + "|" + norm(q);
  sugsHTML(`<li class="sug-msg">Buscando…</li>`);
  let res;
  try {
    if (!cacheAuto.has(k)) cacheAuto.set(k, await BUSCADORES[auto.juego](q));
    res = cacheAuto.get(k);
  } catch (e) {
    if (auto && tok === auto.token) sugsHTML(`<li class="sug-msg">No pude buscar (¿hay internet?). Podés cargarla a mano igual.</li>`);
    return;
  }
  if (!auto || tok !== auto.token) return;       // ya escribió otra cosa
  auto.lista = res;
  if (!res.length) { sugsHTML(`<li class="sug-msg">No encontré cartas con “${esc(q)}”. Probá con el nombre en inglés.</li>`); return; }
  sugsHTML(res.map((r, k) => `<li><button type="button" class="sug" data-accion="sugNombre" data-k="${k}">${imgSug(r.img)}
    <span><b>${esc(r.nombre)}</b><small>${esc(r.info || "")}</small></span></button></li>`).join(""));
}
async function elegirNombre(k){
  const item = auto && auto.lista[k]; if (!item) return;
  auto.item = item;
  const input = $("#c-nombre"); if (input) input.value = item.nombre;
  auto.token++;
  if (!item.ediciones) {
    sugsHTML(`<li class="sug-msg">Buscando ediciones…</li>`);
    const tok = auto.token;
    try { item.ediciones = await edicionesMTG(item.nombre); }
    catch (e) { if (tok === auto.token) sugsHTML(`<li class="sug-msg">No pude traer las ediciones. Completá el set a mano.</li>`); return; }
    if (!auto || tok !== auto.token) return;
  }
  const eds = item.ediciones;
  if (eds.length <= 1) { elegirEdicion(eds[0] || {set: "", setNombre: "", rareza: "", img: item.img, usd: null}); return; }
  sugsHTML(`<li class="sug-msg"><strong style="color:var(--ink)">¿Qué edición es?</strong> ${eds.length} ediciones</li>` +
    eds.map((e, k) => `<li><button type="button" class="sug" data-accion="sugEd" data-k="${k}">${imgSug(e.img || item.img)}
      <span><b>${esc(e.set || "Sin código")}${e.rareza ? " · " + esc(e.rareza) : ""}</b><small>${esc(e.setNombre)}${e.usd ? " · " + usdTxt(e.usd) : ""}</small></span></button></li>`).join(""));
}
async function elegirEdicion(e){
  if (!auto || !auto.item || !e) return;
  if (auto.juego === "pkm" && e.id && !e.listo) {
    const tok = ++auto.token;
    sugsHTML(`<li class="sug-msg">Trayendo los datos de la carta…</li>`);
    try { Object.assign(e, await detallePKM(e), {listo: true}); } catch (err) { e.listo = true; }
    if (!auto || tok !== auto.token) return;
  }
  auto.sel = {nombre: auto.item.nombre, img: e.img || auto.item.img || "", set: e.set, setNombre: e.setNombre, rareza: e.rareza, usd: e.usd};
  const f = $("#f-carta"); if (!f) return;
  f.querySelector("#c-nombre").value = auto.sel.nombre;
  f.querySelector("#c-set").value = auto.sel.set || "";
  const selR = f.querySelector("#c-rareza");
  if (auto.sel.rareza && ![...selR.options].some(o => o.value === auto.sel.rareza)) selR.add(new Option(auto.sel.rareza, auto.sel.rareza));
  selR.value = auto.sel.rareza || "";
  if (auto.juego === "ygo") { const idi = idiomaDeSet(auto.sel.set); if (idi) f.querySelector("#c-idioma").value = idi; }
  f.querySelector("#c-img").value = auto.sel.img;
  sugsHTML("");
  pintarElegida();
}

function grafico(ps, moneda){
  if (!ps.length) return `<p class="ayuda" style="padding:18px 0">Todavía no anotaste precios en ${moneda === "usd" ? "dólares" : "pesos"}. Abrí el sitio, fijate el precio y tocá <strong>Anotar precio</strong>.</p>`;
  const ult = ps[ps.length - 1];
  const cab = `<div style="display:flex;align-items:baseline;gap:10px;margin:10px 0 2px"><b style="font-family:var(--display);font-size:30px" class="num">${plata(ult.v, moneda)}</b>${ps.length > 1 ? chipVar((ult.v - ps[0].v) / ps[0].v * 100) + `<span class="ayuda">desde el ${fFecha(ps[0].f)}</span>` : ""}</div>`;
  if (ps.length < 2) return cab + `<p class="ayuda">Con el próximo precio que anotes aparece el gráfico.</p>`;
  const W = 600, H = 200, L = 8, R = 8, T = 16, B = 26;
  const xs = ps.map(p => new Date(p.f).getTime()), ys = ps.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 *= .9; y1 *= 1.1; if (!y1) y1 = 1; }
  const pad = (y1 - y0) * .15; y0 = Math.max(0, y0 - pad); y1 += pad;
  const px = x => L + (x1 === x0 ? (W - L - R) / 2 : (x - x0) / (x1 - x0) * (W - L - R));
  const py = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const pts = ps.map((p, k) => [px(xs[k]), py(p.v)]);
  const linea = pts.map((p, k) => (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = linea + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z`;
  const sube = ult.v >= ps[0].v, col = sube ? "var(--up)" : "var(--down)";
  const grid = [0.25, .5, .75].map(t => `<line x1="${L}" x2="${W - R}" y1="${T + t * (H - T - B)}" y2="${T + t * (H - T - B)}" stroke="var(--line)" stroke-width="1"/>`).join("");
  const maxV = Math.max(...ys), minV = Math.min(...ys);
  const pMax = pts[ys.indexOf(maxV)], pMin = pts[ys.indexOf(minV)];
  const etq = (p, v, arriba) => `<text x="${Math.min(Math.max(p[0], 60), W - 60)}" y="${arriba ? p[1] - 7 : p[1] + 16}" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="Barlow, sans-serif">${esc(plata(v, moneda))}</text>`;
  return cab + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Precio entre ${fFecha(ps[0].f)} y ${fFecha(ult.f)}">
    ${grid}
    <path d="${area}" fill="${col}" opacity=".12"/>
    <path d="${linea}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${col}"/>`).join("")}
    <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="6" fill="var(--surface)" stroke="${col}" stroke-width="3"/>
    ${maxV !== minV ? etq(pMax, maxV, true) + etq(pMin, minV, false) : ""}
    <text x="${L}" y="${H - 6}" font-size="13" fill="var(--muted)" font-family="Barlow, sans-serif">${fFecha(ps[0].f)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="13" fill="var(--muted)" font-family="Barlow, sans-serif">${fFecha(ult.f)}</text>
  </svg>`;
}

function cargarXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (promXLSX) return promXLSX;
  const fuentes = ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
                   "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"];
  const probar = k => new Promise((ok, mal) => {
    const s = document.createElement("script");

    s.onload = () => window.XLSX ? ok(window.XLSX) : mal(new Error("sin-lector"));

    document.head.appendChild(s);
  });
  promXLSX = probar(0).catch(e => { promXLSX = null; throw e; });

}

// "$ 4.500" → 4500 · "2,35" → 2.35 · "1.234,50" → 1234.5 (en pesos un punto con 3 cifras es de miles)
function aNumero(v, conDecimales){
  if (typeof v === "number") return isFinite(v) ? v : NaN;
  let s = String(v ?? "").trim().replace(/[^\d.,-]/g, "");
  if (!/\d/.test(s)) return NaN;
  const iC = s.lastIndexOf(","), iP = s.lastIndexOf(".");
  if (iC >= 0 && iP >= 0) {
    const dec = iC > iP ? "," : ".";
    s = s.split(dec === "," ? "." : ",").join("").replace(dec, ".");
  } else if (iC >= 0) {
    const tras = s.length - iC - 1;
    s = s.split(",").length > 2 || (tras === 3 && !conDecimales) ? s.replace(/,/g, "") : s.replace(",", ".");
  } else if (iP >= 0) {
    const tras = s.length - iP - 1;
    if (s.split(".").length > 2 || (tras === 3 && !conDecimales)) s = s.replace(/\./g, "");
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
function cantDe(v){
  if (typeof v === "number") return isFinite(v) ? Math.max(0, Math.round(v)) : 1;
  const s = String(v ?? "").trim();
  if (!s) return 1;
  if (/^(-+|no|ninguna|nada)$/i.test(s)) return 0;
  const m = /\d+/.exec(s);
  return m ? parseInt(m[0], 10) : 1;
}
function fechaDe(v){
  const iso = (y, m, d) => {
    if (!(y > 1990 && y < 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
    const f = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    return f > hoy() ? hoy() : f;
  };
  if (typeof v === "number" && v > 20000 && v < 80000) {   // fecha guardada como número de Excel
    const d = new Date(Math.round((v - 25569) * 86400000));
    return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
  const s = String(v ?? "").trim();
  let m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s);
  if (m) return iso(+m[1], +m[2], +m[3]);
  m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(s);
  if (m) return iso(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  return null;
}

/* --- adivinar qué hay en cada columna --- */
function adivinarCampo(titulo){
  const t = " " + norm(titulo).replace(/[^a-z0-9$]+/g, " ").trim() + " ";
  if (t.trim().length < 1 || t.length > 45) return "";
  const hay = (...ps) => ps.some(p => p.endsWith("*") ? t.includes(" " + p.slice(0, -1)) : t.includes(" " + p + " "));
  if (hay("usd", "us$", "u$s", "dolar*", "tcg*")) return "usd";
  if (hay("cant*", "stock", "qty", "quantity", "unidades", "copias", "cuantas", "tengo")) return "cant";
  if (hay("total")) return "costoTotal";
  if (hay("fecha*", "date", "dia")) return "fecha";
  if (hay("rareza*", "rarity", "rare", "rar")) return "rareza";
  if (hay("idioma*", "lang*", "lengua*")) return "idioma";
  if (hay("estado*", "condicion*", "condition", "cond")) return "estado";
  if (hay("set", "sets", "codigo*", "cod", "code", "edicion*", "expansion*", "coleccion*")) return "set";
  if (hay("nota*", "obs*", "coment*", "detalle*", "ubicacion*", "carpeta*")) return "notas";
  if (hay("compr*", "pag*", "costo*", "cost", "invert*")) return "costo";
  if (hay("ml", "mercado*", "valor*", "venta*", "vale", "actual", "vender*", "publica*")) return "ars";
  if (hay("precio*", "price", "$")) return "costo";
  if (hay("nombre*", "carta*", "name", "card*", "descripcion*")) return "nombre";
  return "";
}
function adivinarPorContenido(valores){
  const v = valores.map(x => String(x ?? "").trim()).filter(Boolean);
  if (!v.length) return "";
  const parte = f => v.filter(f).length / v.length;
  if (parte(s => /^[A-Z0-9]{2,5}-[A-Z]{0,2}\d{2,3}$/i.test(s)) > .6) return "set";
  if (parte(s => rarezaDe(s)) > .6) return "rareza";
  if (parte(s => s.length <= 12 && idiomaDe(s)) > .6) return "idioma";
  if (parte(s => s.length <= 20 && estadoDe(s)) > .6) return "estado";
  if (parte(s => /^\d{1,2}$/.test(s)) > .8) return "cant";
  if (parte(s => /[a-záéíóúñ]{3,}/i.test(s) && !/^[\d$]/.test(s)) > .6) return "nombre";
  return "";
}
const filaVacia = fila => !fila || fila.every(x => String(x ?? "").trim() === "");
function filasDatos(){
  const out = [];
  for (let r = imp.filaTitulo + 1; r < imp.raw.length; r++)
    if (!filaVacia(imp.txt[r])) out.push({raw: imp.raw[r] || [], txt: imp.txt[r] || [], n: imp.base.r + r + 1});
  return out;
}
function detectarTitulos(){
  let mejor = -1, puntos = 0, campoUnico = "";
  for (let r = imp.primeraFila; r >= 0 && r < Math.min(imp.txt.length, imp.primeraFila + 10); r++) {
    const fila = imp.txt[r] || [];
    const campos = fila.map(x => typeof x === "string" && !/^\s*[\d$.,]+\s*$/.test(x) ? adivinarCampo(x) : "").filter(Boolean);
    if (campos.length > puntos) { mejor = r; puntos = campos.length; campoUnico = campos[0]; }
  }
  if (puntos >= 2 || (puntos === 1 && ["nombre", "cant"].includes(campoUnico))) return mejor;
  return -1;
}
function adivinarMapa(){
  const mapa = new Array(imp.nCols).fill(""), usados = new Set();
  const tit = imp.filaTitulo >= 0 ? imp.txt[imp.filaTitulo] || [] : [];
  const datos = filasDatos().slice(0, 60);
  for (let i = 0; i < imp.nCols; i++) {
    const g = tit[i] ? adivinarCampo(tit[i]) : "";
    if (g && (g === "notas" || !usados.has(g))) { mapa[i] = g; usados.add(g); }
  }
  for (let i = 0; i < imp.nCols; i++) {
    if (mapa[i]) continue;
    const g = adivinarPorContenido(datos.map(f => f.txt[i]));
    if (g && !usados.has(g)) { mapa[i] = g; usados.add(g); }
  }
  return mapa;
}

/* --- leer el archivo --- */
async function leerArchivo(file){
  const XLSX = await cargarXLSX();
  const buf = await file.arrayBuffer();
  try {
    if (/\.(csv|tsv|txt)$/i.test(file.name)) {
      let texto;
      try { texto = new TextDecoder("utf-8", {fatal: true}).decode(buf); }
      catch (e) { texto = new TextDecoder("windows-1252").decode(buf); }
      return XLSX.read(texto.replace(/^﻿/, ""), {type: "string", raw: true});
    }
    return XLSX.read(buf, {type: "array"});
  } catch (e) { throw new Error("ilegible"); }
}
function elegirHoja(nombreHoja){
  const XLSX = window.XLSX, ws = imp.libro.Sheets[nombreHoja];
  const conDatos = ws && ws["!ref"];
  imp.hojaNombre = nombreHoja;
  imp.raw = conDatos ? XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: "", blankrows: true}) : [];
  imp.txt = conDatos ? XLSX.utils.sheet_to_json(ws, {header: 1, raw: false, defval: "", blankrows: true}) : [];
  imp.base = conDatos ? XLSX.utils.decode_range(ws["!ref"]).s : {r: 0, c: 0};
  imp.nCols = imp.txt.reduce((m, f) => Math.max(m, f.length), 0);
  imp.primeraFila = imp.txt.findIndex(f => !filaVacia(f));
  imp.filaTitulo = detectarTitulos();
  imp.mapa = adivinarMapa();
  imp.tareas = null;
}
async function elegirArchivo(file){
  if (importando) return;
  const boton = hoja.querySelector(".lee");

      ? "No se pudo cargar el lector de Excel. Revisá la conexión a internet y probá de nuevo."
      : "No pude leer ese archivo. Abrilo en Excel, guardalo como .xlsx (o .csv) y elegilo de nuevo."; }
    return;
  }
  imp = {nombre: file.name, libro};

      if (!rareza) { const propia = J().rarezas.find(r => clave(r) === clave(txt("rareza"))); if (propia || ui.juego !== "ygo") rareza = propia || txt("rareza"); else notas.push("Rareza: " + txt("rareza")); }
    }
    if (txt("idioma")) { idioma = idiomaDe(txt("idioma")); if (!idioma) { idioma = "Otro"; notas.push("Idioma: " + txt("idioma")); } }
    else idioma = (ui.juego === "ygo" && idiomaDeSet(set)) || "Inglés";
    if (txt("estado")) { const e = estadoDe(txt("estado")); if (e) estado = e; else notas.push("Estado: " + txt("estado")); }
    const cant = col("cant") >= 0 ? cantDe(raw("cant")) : 1;
    let costo = 0;
    if (col("costo") >= 0) { const n = aNumero(raw("costo"), false); if (n > 0) costo = n; }
    else if (col("costoTotal") >= 0) { const n = aNumero(raw("costoTotal"), false); if (n > 0 && cant > 0) costo = n / cant; }
    costo = Math.round(costo * 100) / 100;
    const fecha = col("fecha") >= 0 ? fechaDe(raw("fecha")) || fechaDe(txt("fecha")) || fechaHoy : fechaHoy;
    const precios = [];
    if (col("ars") >= 0) { const n = aNumero(raw("ars"), false); if (n > 0) precios.push({f: fechaHoy, v: n, m: "ars"}); }
    if (col("usd") >= 0) { const n = aNumero(raw("usd"), true); if (n > 0) precios.push({f: fechaHoy, v: Math.round(n * 100) / 100, m: "usd"}); }

    const k = claveCarta({juego: ui.juego, nombre, set, rareza, idioma});
    let carta = nuevas.get(k), ya = false;
    if (!carta) {
      const ex = existentes.get(k);
      if (ex) { ya = true; carta = tocadas.get(ex.id); if (!carta) { carta = {...ex, precios: [...(ex.precios || [])], _cambio: false}; tocadas.set(ex.id, carta); } }
      else { carta = {id: nuevoId(), juego: ui.juego, nombre, set, rareza, idioma, estado, notas: "", creada: fechaHoy, precios: []}; nuevas.set(k, carta); }
    }
    for (const n of notas) if (agregarNota(carta, n) && ya) carta._cambio = true;
    for (const p of precios) {
      carta.precios = carta.precios.filter(q => !(q.f === p.f && q.m === p.m)); carta.precios.push(p);
      if (ya) carta._cambio = true;
    }
    if (cant > 0) {
      movsNuevos.push({id: nuevoId(), cartaId: carta.id, tipo: "compra", cant, precio: costo, fecha, nota, ts: Date.now() + movsNuevos.length});
      unidades += cant;
      if (ya) tocadas.get(carta.id)._mov = true;
    }
    filas.push({carta, cant, costo, precios, ya});
  }
  const aGuardar = [...nuevas.values(), ...[...tocadas.values()].filter(c => c._cambio)].map(c => { const o = {...c}; delete o._cambio; delete o._mov; return o; });
  return {filas, nuevas: nuevas.size, existentes: tocadas.size, unidades, salteadas, cartas: aGuardar, movs: movsNuevos};
}

function pintarProgreso(){
  const tot = imp.tareas.length, h = imp.hechas, p = tot ? Math.round(h / tot * 100) : 100;
  let el = hoja.querySelector("#imp-prog");
  if (!el) {
    hoja.innerHTML = `<div class="hoja-top"><h2>Cargando tus cartas…</h2></div>
      <div id="imp-prog"></div><p class="ayuda">No cierres la app hasta que termine.</p>`;
    el = hoja.querySelector("#imp-prog");
  }
  el.innerHTML = `<div class="progreso" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div><p class="num" style="margin:0">${p}%</p>`;
}

async function ejecutarImport(){
  if (!imp || !imp.plan || importando) return;
  const plan = imp.plan;
  if (!imp.tareas) {
    imp.tareas = [...plan.cartas.map(o => ({col: "c", o})), ...plan.movs.map(o => ({col: "m", o}))];
    imp.listas = imp.tareas.map(() => false);
    imp.hechas = 0;
  }
  importando = true;
  hoja.innerHTML = "";
  pintarProgreso();
  const pendientes = imp.tareas.map((t, i) => i).filter(i => !imp.listas[i]);
  let k = 0, error = null;
  const trabajar = async () => {
    while (!error && k < pendientes.length) {
      const i = pendientes[k++], {col, o} = imp.tareas[i];
      try {
        if (modoPrueba) { if (col === "c") cartas.set(o.id, o); else movs.push(o); }
        else await conReintento(() => (col === "c" ? colCartas : colMovs).doc(o.id).set(sinId(o)));
        imp.listas[i] = true; imp.hechas++;
        pintarProgreso();
      } catch (e) { error = e; }
    }
  };
  await Promise.all([0, 1, 2, 3].map(trabajar));
  if (!error && modoPrueba) {
    try { persistir(); }
    catch (e) { error = e; try { leerLocal(); } catch (_) {} imp.listas = imp.listas.map(() => false); imp.hechas = 0; }
  }
  importando = false;
  if (error) {
    const lleno = error && error.code === "quota_exceeded";
    hoja.innerHTML = cabecera("No se pudo terminar") + `
      <p>Se guardó el ${Math.round(imp.hechas / imp.tareas.length * 100)}% de la planilla. ${lleno ? "Se llenó el espacio de la app." : "Algo falló al guardar."}</p>
      <p class="ayuda">Tocá <strong>Reintentar</strong> para cargar lo que faltó: lo que ya se guardó no se repite.</p>
      <div class="fila-btns"><button class="btn" data-accion="cerrar">Cerrar</button>${lleno ? "" : `<button class="btn pri" data-accion="reintentarImport">Reintentar</button>`}</div>`;
    render();
    return;
  }
  const n = plan.nuevas + plan.existentes;
  imp = null;
  cerrar();
  Object.assign(ui, {tab: "stock", q: "", rareza: null});
  window.scrollTo(0, 0);
  render();
  toast(`Listo: ${n} carta${n === 1 ? "" : "s"} importada${n === 1 ? "" : "s"}`);
}

function exportarCopia(){
  const blob = new Blob([JSON.stringify(datosCopia())], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mis-cartas-" + hoy() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Copia guardada en Descargas");
}
function limpiarCopia(d){
  if (!d || d.app !== "mis-cartas" || !Array.isArray(d.cartas) || !Array.isArray(d.movs)) return null;
  const txt = v => typeof v === "string" ? v : "";
  const esFecha = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const num = v => typeof v === "number" && isFinite(v) && v >= 0;
  const cs = new Map();
  for (const c of d.cartas) {
    if (!c || typeof c.id !== "string" || !c.id || !txt(c.nombre).trim()) continue;
    cs.set(c.id, {id: c.id, ...(c.clase === "sellado" ? {clase: "sellado", producto: txt(c.producto)} : {}), juego: JUEGOS[c.juego] ? c.juego : "ygo", img: /^https:\/\//.test(txt(c.img)) ? c.img : "", nombre: c.nombre, set: txt(c.set), rareza: txt(c.rareza), idioma: txt(c.idioma) || "Inglés",
      estado: txt(c.estado) || "Near Mint", notas: txt(c.notas), creada: esFecha(c.creada) ? c.creada : hoy(),
      precios: (Array.isArray(c.precios) ? c.precios : []).filter(p => p && esFecha(p.f) && num(p.v) && (p.m === "usd" || p.m === "ars")).map(p => ({f: p.f, v: p.v, m: p.m}))});
  }
  const ms = [];
  for (const m of d.movs) {
    if (!m || typeof m.id !== "string" || !cs.has(m.cartaId) || !(m.tipo === "compra" || m.tipo === "venta") || !num(m.cant) || !num(m.precio) || !esFecha(m.fecha)) continue;
    ms.push({id: m.id, cartaId: m.cartaId, tipo: m.tipo, cant: m.cant, precio: m.precio, fecha: m.fecha, nota: txt(m.nota), ts: typeof m.ts === "number" ? m.ts : 0});
  }
  return {cartas: cs, movs: ms, fecha: esFecha(d.fecha) ? d.fecha : null};
}
async function restaurarCopia(file){
  let d = null;
  try { d = limpiarCopia(JSON.parse(await file.text())); } catch (e) {}
  if (!d) { const el = $("#copia-error"); if (el) { el.hidden = false; el.textContent = "Ese archivo no es una copia de Mis Cartas."; } return; }
  confirmar(`Se reemplaza todo lo que hay en este dispositivo (${cartas.size} carta(s)) por la copia${d.fecha ? " del " + fFecha(d.fecha) : ""}: <strong>${d.cartas.size} carta(s)</strong> y ${d.movs.length} movimiento(s).`, "Restaurar copia",
    async () => { local(() => { cartas = d.cartas; movs = d.movs; }); toast("Copia restaurada"); });
}

const CLAVE_COMP = "mis-cartas-compartir";
const comp = Object.assign({moneda: "ars", ajuste: 0, cuales: "todas", conEd: true, conCant: true, titulos: {}},
  (() => { try { return JSON.parse(localStorage.getItem(CLAVE_COMP) || "{}"); } catch (e) { return {}; } })());
function guardarComp(){ try { localStorage.setItem(CLAVE_COMP, JSON.stringify(comp)); } catch (e) {} }
const tituloComp = () => comp.titulos[ui.juego] || `Vendo cartas de ${J().nombre}`;
const hayFiltro = () => !!(norm(ui.q).trim() || ui.rareza);

function precioVenta(i){
  const base = comp.moneda === "usd" ? i.usd : comp.moneda === "ars" ? i.ars : null;
  if (base == null) return null;
  const v = base * (1 + (comp.ajuste || 0) / 100);
  if (comp.moneda === "usd") return usd(Math.round(v * 100) / 100);
  return ars(v >= 2000 ? Math.round(v / 100) * 100 : Math.round(v));
}
function textoCompartir(){
  const idx = indiceMovs();
  const base = comp.cuales === "vista" && hayFiltro() ? filtradas(idx) : cartasJuego().map(c => ({c, i: infoCarta(c, idx)}));
  const filas = base.filter(x => x.i.stock > 0).sort((a, b) => esSellado(a.c) - esSellado(b.c) || a.c.nombre.localeCompare(b.c.nombre, "es"));
  const cajas = filas.filter(x => esSellado(x.c)), sueltas = filas.filter(x => !esSellado(x.c));
  const linea = ({c, i}) => {
    if (esSellado(c)) {
      const ed = [c.producto, comp.conEd ? c.set : "", c.idioma && c.idioma !== "Inglés" ? c.idioma : ""].filter(Boolean).join(" · ");
      const p = comp.moneda === "no" ? "" : (precioVenta(i) ? `*${precioVenta(i)}*` : "consultar");
      return "• " + c.nombre + (ed ? ` (${ed})` : "") + (comp.conCant && i.stock > 1 ? ` x${i.stock}` : "") + (p ? " — " + p : "");
    }
    const ed = comp.conEd ? [c.set, c.rareza, c.idioma && c.idioma !== "Inglés" ? c.idioma : "", c.estado && c.estado !== "Near Mint" ? c.estado : ""].filter(Boolean).join(" · ") : "";
    const p = comp.moneda === "no" ? "" : (precioVenta(i) ? `*${precioVenta(i)}*` : "consultar");
    return "• " + c.nombre + (ed ? ` (${ed})` : "") + (comp.conCant && i.stock > 1 ? ` x${i.stock}` : "") + (p ? " — " + p : "");
  };
  const lineas = cajas.length && sueltas.length
    ? ["_Cartas_", ...sueltas.map(linea), "", "_Cajas y sobres cerrados_", ...cajas.map(linea)]
    : filas.map(linea);
  const pie = comp.moneda === "no" ? "Consultá precios por privado." : "Precios por unidad. Consultas por privado.";
  return {n: filas.length, texto: `*${tituloComp()}*\n\n${lineas.join("\n")}\n\n${pie}`};
}
function abrirCompartir(){
  const seg = (nombre, valor, ops) => `<div class="seg" role="radiogroup" style="grid-template-columns:repeat(${ops.length},1fr)">${ops.map(([v, t]) =>
    `<input type="radio" name="${nombre}" id="${nombre}-${v}" value="${v}" ${valor === v ? "checked" : ""}><label for="${nombre}-${v}">${t}</label>`).join("")}</div>`;
  abrir(cabecera("Lista para compartir") + `<form id="f-comp" class="compartir">
    <p class="ayuda" style="margin-top:-6px">Arma la lista de tus cartas (y cajas cerradas) de ${esc(J().nombre)} con stock, lista para mandar por WhatsApp o pegar en grupos de Facebook.</p>
    ${hayFiltro() ? `<div class="campo"><label>Qué cartas</label>${seg("cuales", comp.cuales, [["todas", "Todas con stock"], ["vista", "Solo las filtradas"]])}</div>` : ""}
    <div class="campo"><label>Precio</label>${seg("moneda", comp.moneda, [["ars", "Pesos"], ["usd", "Dólares"], ["no", "Sin precio"]])}</div>
    <div class="dos">
      <div class="campo"><label for="comp-ajuste">Ajuste de precio (%)</label><input id="comp-ajuste" name="ajuste" type="number" inputmode="numeric" step="1" value="${comp.ajuste || 0}"></div>
      <div class="campo"><label for="comp-titulo">Título</label><input id="comp-titulo" name="titulo" value="${esc(tituloComp())}"></div>
    </div>
    <p class="ayuda" style="margin-top:-6px">Usa el último precio que anotaste de cada carta. Con el ajuste lo subís o bajás (ej: -10 = 10% menos).</p>
    <label class="check" style="margin:0"><input type="checkbox" name="conEd" ${comp.conEd ? "checked" : ""}><span>Mostrar edición y rareza</span></label>
    <label class="check" style="margin:0"><input type="checkbox" name="conCant" ${comp.conCant ? "checked" : ""}><span>Mostrar cuántas tengo</span></label>
    <div class="campo"><label for="comp-texto">Así queda (lo podés editar antes de mandarlo)</label><textarea id="comp-texto"></textarea></div>
    <p class="ayuda" id="comp-info"></p>
    <div class="fila-btns">
      <button type="button" class="btn wsp" data-accion="compWsp">Enviar por WhatsApp</button>
      <button type="button" class="btn" data-accion="compCopiar">Copiar</button>
      ${navigator.share ? `<button type="button" class="btn" data-accion="compShare">Compartir…</button>` : ""}
    </div></form>`, {tipo: "compartir"});
  rehacerCompartir();
}
function rehacerCompartir(){
  const t = textoCompartir(), area = $("#comp-texto"), info = $("#comp-info");
  if (!area) return;
  area.value = t.texto;
  info.textContent = !t.n ? "No hay cartas con stock para poner en la lista." :
    `${t.n} carta${t.n === 1 ? "" : "s"} en la lista.` + (t.texto.length > 3500 ? " Es larga: si WhatsApp no la abre entera, usá Copiar y pegala." : "");
}
async function copiarTexto(texto){
  try { await navigator.clipboard.writeText(texto); return true; }
  catch (e) {
    const a = $("#comp-texto"); if (!a) return false;
    a.select(); try { return document.execCommand("copy"); } catch (_) { return false; }
  }
}
