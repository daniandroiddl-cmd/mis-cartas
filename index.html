document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-accion], [data-tab]");
  if (!t) { if (ev.target === capa) cerrar(); return; }
  if (t.dataset.tab) { ui.tab = t.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const a = t.dataset.accion, id = t.dataset.id;
  switch (a) {
    case "nueva": ui.clase === "sellado" ? abrirFormSellado() : abrirFormCarta(); break;
    case "juego": cambiarJuego(t.dataset.j); break;
    case "sugNombre": elegirNombre(+t.dataset.k); break;
    case "sugEd": if (auto && auto.item) elegirEdicion(auto.item.ediciones[+t.dataset.k]); break;
    case "sacarSel": { auto.sel = null; auto.item = null; $("#c-img").value = ""; pintarElegida(); const n = $("#c-nombre"); n.focus(); n.select(); programarBusqueda(n.value); break; }
    case "compartir": abrirCompartir(); break;
    case "compWsp": { const tx = $("#comp-texto").value; window.open("https://wa.me/?text=" + encodeURIComponent(tx), "_blank", "noopener"); break; }
    case "compCopiar": toast(await copiarTexto($("#comp-texto").value) ? "Lista copiada" : "No se pudo copiar: seleccioná el texto a mano"); break;
    case "compShare": try { await navigator.share({text: $("#comp-texto").value}); } catch (e) {} break;
    case "importar": abrirImportar(); break;
    case "copia": abrirCopia(); break;
    case "exportarCopia": exportarCopia(); break;
    case "importarYa": case "reintentarImport": t.disabled = true; await ejecutarImport(); break;
    case "cerrar": cerrar(); break;
    case "detalle": abrirDetalle(id); break;
    case "editar": esSellado(cartas.get(id)) ? abrirFormSellado(id) : abrirFormCarta(id); break;
    case "mov": abrirFormMov(id, t.dataset.t); break;
    case "precio": abrirFormPrecio(id); break;
    case "soloStock": ui.soloStock = !ui.soloStock; vistaStock(); break;
    case "rareza": ui.rareza = ui.rareza === t.dataset.r ? null : t.dataset.r; vistaStock(); break;
    case "tipoMov": ui.tipoMov = t.dataset.t; vistaMovs(); break;
    case "monedaGraf": ui.monedaGraf = t.dataset.m; abrirDetalle(ui.modal.id, true); break;
    case "borrarMov": {
      const m = movs.find(x => x.id === id), c = m && cartas.get(m.cartaId);
      confirmar(`Se borra la ${m.tipo} de ${m.cant} × ${esc(c ? c.nombre : "carta")} del ${fFecha(m.fecha)}. El stock se recalcula.`, "Borrar movimiento",
        async () => { await borrarMovDB(id); toast("Movimiento borrado"); });
      break;
    }
    case "borrarCarta": {
      const c = cartas.get(id);
      confirmar(`Se borra <strong>${esc(c.nombre)}</strong> con todas sus compras, ventas y precios. No se puede deshacer.`, esSellado(c) ? "Borrar producto" : "Borrar carta",
        async () => { await borrarCartaDB(id); toast("Carta borrada"); });
      break;
    }
    case "borrarPrecio": {
      const c = cartas.get(id);
      const precios = (c.precios || []).filter(p => !(p.f === t.dataset.f && p.m === t.dataset.m));
      await guardarCarta({...c, precios});
      if (modoPrueba) abrirDetalle(id, true);
      break;
    }
    case "cancelarConf": { const v = ui.modal.volver; v && v.tipo === "detalle" ? abrirDetalle(v.id) : cerrar(); break; }
    case "okConf": {
      const {accion, volver} = ui.modal;
      t.disabled = true;
      try { await accion(); } catch (e) { t.disabled = false; return; }
      if (volver && volver.tipo === "detalle" && cartas.has(volver.id)) abrirDetalle(volver.id); else cerrar();
      break;
    }
  }
});

document.addEventListener("input", ev => {
  if (ev.target.id === "q") { ui.q = ev.target.value; pintarLista(); }
  if (ev.target.id === "c-nombre" && auto) {
    if (auto.sel && ev.target.value !== auto.sel.nombre) { auto.sel = null; auto.item = null; $("#c-img").value = ""; pintarElegida(); }
    programarBusqueda(ev.target.value);
  }
  if (ev.target.form && ev.target.form.id === "f-comp" && ev.target.id !== "comp-texto") leerComp(ev.target.form);
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !capa.hidden) cerrar(); });
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "imp-archivo") { if (t.files && t.files[0]) elegirArchivo(t.files[0]); t.value = ""; return; }
  if (t.id === "copia-archivo") { if (t.files && t.files[0]) restaurarCopia(t.files[0]); t.value = ""; return; }
  if (t.form && t.form.id === "f-comp" && t.id !== "comp-texto") { leerComp(t.form); return; }
  if (t.name === "clase" && !t.form) { ui.clase = t.value; ui.rareza = null; ui.q = ""; render(); return; }
  if (!imp || !imp.libro) return;
  if (t.id === "imp-hoja") { elegirHoja(t.value); pintarImport(); }
  else if (t.id === "imp-titulos") { imp.filaTitulo = t.checked ? imp.primeraFila : -1; imp.mapa = adivinarMapa(); pintarImport(); }
  else if (t.classList.contains("imp-campo")) {
    const col = +t.dataset.col, campo = t.value;
    // cada dato sale de una sola columna (menos las notas, que se juntan)
    if (campo && campo !== "notas") imp.mapa = imp.mapa.map((c, i) => i !== col && c === campo ? "" : c);
    imp.mapa[col] = campo;
    pintarImport();
  }
});

function leerComp(f){
  const d = Object.fromEntries(new FormData(f));
  if (d.cuales) comp.cuales = d.cuales;
  comp.moneda = d.moneda || "ars";
  const aj = parseFloat(d.ajuste); comp.ajuste = isFinite(aj) ? Math.max(-90, Math.min(500, aj)) : 0;
  comp.conEd = !!d.conEd; comp.conCant = !!d.conCant;
  const tit = (d.titulo || "").trim();
  if (tit && tit !== `Vendo cartas de ${J().nombre}`) comp.titulos[ui.juego] = tit; else delete comp.titulos[ui.juego];
  guardarComp();
  rehacerCompartir();
}
function mostrarError(idEl, texto){ const el = $(idEl); el.textContent = texto; el.hidden = !texto; }

document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, d = Object.fromEntries(new FormData(f));
  const btn = f.querySelector('[type="submit"]');

  if (f.id === "f-sellado") {
    const nombre = d.nombre.trim();
    if (!nombre) return mostrarError("#s-error", "Escribí el nombre.");
    const existente = f.dataset.id ? cartas.get(f.dataset.id) : null;
    const prod = {
      ...(existente || {}),
      id: existente ? existente.id : nuevoId(), clase: "sellado",
      juego: existente ? juegoDe(existente) : (JUEGOS[f.dataset.juego] ? f.dataset.juego : ui.juego),
      producto: d.producto, nombre, set: d.set.trim().toUpperCase(), rareza: "", idioma: d.idioma, estado: "Near Mint", notas: d.notas.trim(),
      creada: existente?.creada || hoy(), precios: existente?.precios ? [...existente.precios] : []
    };
    let cant = 0, costo = 0;
    if (!existente) {
      cant = parseInt(d.cant || "0", 10);
      costo = d.costo ? numero(d.costo) : 0;
      if (!(cant >= 0)) return mostrarError("#s-error", "La cantidad tiene que ser 0 o más.");
      if (isNaN(costo) || costo < 0) return mostrarError("#s-error", "El precio pagado no es un número válido.");
    }
    btn.disabled = true;
    try {
      await guardarCarta(prod);
      if (cant > 0) await guardarMov({id: nuevoId(), cartaId: prod.id, tipo: "compra", cant, precio: costo, fecha: hoy(), nota: "Carga inicial", ts: Date.now()});
    } catch (e) { btn.disabled = false; return; }
    toast(existente ? "Cambios guardados" : `${nombre} guardado`);
    if (existente) abrirDetalle(prod.id); else cerrar();
  }

  if (f.id === "f-carta") {
    const nombre = d.nombre.trim();
    if (!nombre) return mostrarError("#c-error", "Escribí el nombre de la carta.");
    const existente = f.dataset.id ? cartas.get(f.dataset.id) : null;
    const carta = {
      ...(existente || {}),
      id: existente ? existente.id : nuevoId(),
      juego: existente ? juegoDe(existente) : (JUEGOS[f.dataset.juego] ? f.dataset.juego : ui.juego),
      nombre, set: d.set.trim().toUpperCase(), rareza: d.rareza, idioma: d.idioma, estado: d.estado, notas: d.notas.trim(),
      img: /^https:\/\//.test(d.img || "") ? d.img : "",
      creada: existente?.creada || hoy(), precios: existente?.precios ? [...existente.precios] : []
    };
    if (d.precioHoy && auto && auto.sel && auto.sel.usd) {
      carta.precios = carta.precios.filter(p => !(p.f === hoy() && p.m === "usd"));
      carta.precios.push({f: hoy(), v: auto.sel.usd, m: "usd"});
    }
    let cant = 0, costo = 0;
    if (!existente) {
      cant = parseInt(d.cant || "0", 10);
      costo = d.costo ? numero(d.costo) : 0;
      if (!(cant >= 0)) return mostrarError("#c-error", "La cantidad tiene que ser 0 o más.");
      if (isNaN(costo) || costo < 0) return mostrarError("#c-error", "El precio pagado no es un número válido.");
    }
    btn.disabled = true;
    try {
      await guardarCarta(carta);
      if (cant > 0) await guardarMov({id: nuevoId(), cartaId: carta.id, tipo: "compra", cant, precio: costo, fecha: hoy(), nota: "Carga inicial", ts: Date.now()});
    } catch (e) { btn.disabled = false; return; }
    toast(existente ? "Cambios guardados" : `${nombre} guardada`);
    if (existente) abrirDetalle(carta.id); else cerrar();
  }

  if (f.id === "f-mov") {
    const tipo = f.dataset.t, id = f.dataset.id;
    const cant = parseInt(d.cant, 10), precio = d.precio ? numero(d.precio) : 0;
    if (!(cant > 0)) return mostrarError("#m-error", "La cantidad tiene que ser 1 o más.");
    if (isNaN(precio) || precio < 0) return mostrarError("#m-error", "El precio no es un número válido.");
    const stock = infoCarta(cartas.get(id)).stock;
    if (tipo === "venta" && cant > stock) return mostrarError("#m-error", `Solo tenés ${stock} en stock.`);
    btn.disabled = true;
    try { await guardarMov({id: nuevoId(), cartaId: id, tipo, cant, precio, fecha: d.fecha || hoy(), nota: d.nota.trim(), ts: Date.now()}); }
    catch (e) { btn.disabled = false; return; }
    toast(tipo === "venta" ? `Venta registrada: ${ars(cant * precio)}` : "Compra registrada");
    abrirDetalle(id);
  }

  if (f.id === "f-precio") {
    const id = f.dataset.id, c = cartas.get(id);
    const v = d.m === "usd" ? numeroDec(d.v) : numero(d.v);
    if (isNaN(v) || v <= 0) return mostrarError("#p-error", "Escribí un precio mayor a cero.");
    const fecha = d.f || hoy();
    const precios = (c.precios || []).filter(p => !(p.f === fecha && p.m === d.m));
    precios.push({f: fecha, v, m: d.m});
    btn.disabled = true;
    try { await guardarCarta({...c, precios}); } catch (e) { btn.disabled = false; return; }
    ui.monedaGraf = d.m;
    toast("Precio anotado");
    abrirDetalle(id);
  }
});

/* ------------------------------------------------------------------ inicio */
function iniciar(){
  modoPrueba = true;   // guardado local, sin cuenta
  try { leerLocal(); estado("Guardado en este dispositivo"); }
  catch (e) {
    estado("Sin guardado");
    aviso("Este navegador no deja guardar datos (¿está en modo incógnito?). Lo que cargues se pierde al cerrar.");
  }
  cargadoC = cargadoM = confirmado = true;
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* el formulario abierto no se pisa con un render; solo el detalle se refresca */
iniciar();
})();
</script>
